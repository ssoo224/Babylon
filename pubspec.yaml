name: babylon_chat
description: Babylon Chat - Flutter version
publish_to: 'none'
version: 1.0.0+62

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
