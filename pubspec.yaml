name: babylon_chat
description: Babylon Chat - Flutter version
publish_to: 'none'
version: 1.0.0+62

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  intl: any
  flutter_svg: ^2.0.10+1
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  photo_manager: ^3.5.0
  image: ^4.2.0
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon-only.png"
  adaptive_icon_background: "assets/icon-background.png"
  adaptive_icon_foreground: "assets/icon-foreground.png"
